[settings]
# gwq で切る worktree 配下の .mise.toml を毎回 mise trust しなくて済むようにする
trusted_config_paths = ["~/worktrees"]
# 自分の fork の release は公開直後に入れたいので release age 待ちから除外する
minimum_release_age_excludes = ["github:kowwwwji/gh-board"]

[tools]
# npm製CLIツール（mise の npm バックエンドで npm i -g 相当を再現）
# chromium-bidi（puppeteer 経由の依存）は Chromium 本体へ移転後、Chrome for Testing の
# パイプラインから provenance なしで公開される（上流 README の Publish 節）。以前の
# GitHub Actions 公開版より信頼度が下がったと aube の trust policy に毎回止められるため、
# 公開元が変わらない限りパッケージ単位で除外する（バージョン指定だと puppeteer 更新ごとに再発する）
"npm:@mermaid-js/mermaid-cli" = { version = "latest", trust_policy_excludes = ["chromium-bidi"] }

# gh 拡張（mise の github バックエンドで GitHub Releases の単体バイナリとして取得）
# gh 本体には拡張の宣言的管理（Brewfile 相当）が無く Homebrew にも formula が無いため、
# ここを唯一の正として全PCで同じ拡張を揃える。gh は拡張ディレクトリしか見ないので
# `gh dash` ではなく `gh-dash` のように直接呼ぶ（gh の拡張機構を経由しなくても単体で動く）。
# github/gh-projects は本体の `gh project` に吸収済み（アーカイブ）のため入れない。
# gh-board / gh-stack はリリースアセット名が `darwin-arm64` のように OS/arch だけで、
# mise の自動命名だと `darwin` になり実行ファイルを見つけられないため bin で名前を固定する。
"github:dlvhdr/gh-dash" = "latest"
# gh-board は upstream (uzimaru0000) に取り込まれない自前パッチを含む fork (kowwwwji/gh-board) を使う。
# fork の `fork` ブランチから `vX.Y.Z-fork.N` を tag して release する。
"github:kowwwwji/gh-board" = { version = "latest", bin = "gh-board" }
"github:github/gh-stack" = { version = "latest", bin = "gh-stack" }
