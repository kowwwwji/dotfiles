# AeroSpace 設定（公式デフォルトをベースに構成）
# 公式ドキュメント: https://nikitabobko.github.io/AeroSpace/guide
#
# 設計方針（.claude/specs/2026-08-04-window-management-design.md）:
# - キーバインドは alt+数字と alt+記号少数に限定する。
#   ghostty の macos-option-as-alt = left で左 Option を nvim の Meta に使う運用のため、
#   alt+英字（hjkl 含む）のバインドは置かない。
# - borders / sketchybar は brew services (launchd) で常駐管理するため
#   after-startup-command からは起動しない。

# aerospace 自身がログイン項目を管理する
start-at-login = true

# normalization は公式デフォルト値のまま
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# 0 にしてアコーディオンの重なり（左右にはみ出す帯）を出さず、単一ウィンドウ全画面風に見せる。
# ウィンドウの行き来は alt-tab（ワークスペース内巡回）で行う
accordion-padding = 0
# ウィンドウ既定は floating（下の catch-all on-window-detected）。tiling に戻した窓が
# 入るルートコンテナのレイアウトがこれ（accordion-padding=0 の全画面風運用）
default-root-container-layout = 'accordion'
default-root-container-orientation = 'auto'

# フォーカスしたモニタへマウスも追従させる（マルチモニタでの迷子防止）
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# sketchybar の WS ウィジェットへフォーカス変更を通知する（イベント駆動。ポーリング不採用）
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# 同一 WS 内のウィンドウ開閉・移動でも WS チップのアイコン列を追従させる。
# FOCUSED_WORKSPACE は渡らないが、plugins/aerospace.sh が空なら aerospace へ問い合わせて補う
on-focus-changed = ['exec-and-forget sketchybar --trigger aerospace_workspace_change']

[key-mapping]
    preset = 'qwerty'

# gaps は inner/outer とも 10。outer.top のみ、sketchybar の実下端
# （height=35 → 35px）に JankyBorders の枠の外側はみ出し
# （bordersrc width=5.0 の半分 = 2.5px）が被らないよう 35+2.5+余白1px ≒ 39 を確保する。
# outer.top は NSScreen.visibleFrame（メニューバー予約領域を除いた矩形）への加算のため、
# ノッチ行 32px が常時予約される内蔵ディスプレイだけ 32+7=39 になるよう 7 に下げる。
# NOTE: 'built-in' は内蔵ディスプレイを持つ Mac なら必ずマッチする（下のモニタ名パターンの
# ような不一致 no-op 劣化はしない）。非ノッチ機へ展開する際は先に 7 の調整が必要
#
# outer.bottom の japannext だけ 9: WM が決めるウィンドウ高が Ghostty のセル高
# （font-size 14 + adjust-cell-height 5% で 17.5pt）で割り切れないと、端数が下端に寄って
# tmux ステータスラインが浮いて見える。(visibleFrame高 - outer.top 39 - outer.bottom
# - Ghostty 上padding 3) が 17.5 の倍数に近づく値を選ぶ。
# 注意: macOS はディスプレイ構成（クラムシェル/蓋開き）ごとに解像度設定を別持ちし、
# JAPANNEXT の visibleFrame 高が構成で変わる。9 は両構成の妥協点:
#   - クラムシェル 2048x1365 (visibleFrame 1364) → 誤差 0.5pt (75行)
#   - 蓋開き 1920x1280 (visibleFrame 1280) → 誤差 4pt (70行)
# visibleFrame 高の実測は System Events でタイル済み窓の y+高さ+outer.bottom を合算。
# フォントサイズや sketchybar 高を変えたら再計算。他モニタ・他PCはパターン不一致で 10 のまま
[gaps]
    inner.horizontal = 10
    inner.vertical =   10
    outer.left =       10
    outer.bottom =     [{ monitor.'japannext' = 9 }, 10]
    outer.top =        [{ monitor.'built-in' = 7 }, 39]
    outer.right =      10

# WS をモニタに固定する運用（1=内蔵/確認用, 2=JAPANNEXT/メイン, 3=PL2390/縦長）。
# パターンは大文字小文字を区別しない部分一致。モニタ名はこのデスクの機材固有だが、
# 未接続・他PCではパターン不一致で単に固定されないだけ（エラーにならず通常挙動に
# 劣化）なので共有 config に置いてよい。
[workspace-to-monitor-force-assignment]
    1 = 'built-in'
    2 = 'japannext'
    3 = 'pl2390'

# 新規ウィンドウは既定で floating。aerospace には floating を既定にする専用オプションが
# 無い（default-root-container-layout は tiles / accordion のみ）ため、条件なしの
# on-window-detected を catch-all として使う。
# on-window-detected は既定で「最初にマッチした1件」しか実行しないので、以降のアプリ別
# ルール（WS 割当）まで届くよう check-further-callbacks = true を付ける。位置も先頭必須。
# タイルに載せたいウィンドウは alt-f（floating/tiling トグル）か alt-slash / alt-comma で戻す
[[on-window-detected]]
    check-further-callbacks = true
    run = 'layout floating'

# アプリ自動配置。Slack は WS1（内蔵/確認用）、Ghostty は WS2（メイン作業）、
# Apple Music・LINE は WS3（縦長）へ。ブラウザは全ディスプレイで使うため割当なし。
[[on-window-detected]]
    if.app-id = 'com.tinyspeck.slackmacgap' # Slack
    run = 'move-node-to-workspace 1'

[[on-window-detected]]
    if.app-id = 'com.mitchellh.ghostty' # Ghostty
    run = 'move-node-to-workspace 2'

[[on-window-detected]]
    if.app-id = 'com.apple.Music' # Apple Music
    run = 'move-node-to-workspace 3'

[[on-window-detected]]
    if.app-id = 'jp.naver.line.mac' # LINE
    run = 'move-node-to-workspace 3'

[mode.main.binding]
    # ワークスペース内の全ウィンドウ巡回（Cmd+Tab / Cmd+Shift+Tab と同じ語彙）。
    # 向き・レイアウトに関係なく順に巡る。方向指定のフォーカス移動・並べ替え（hjkl）は
    # 左 Option を nvim の Meta に全て譲るため置かない。
    # 標準の focus dfs-next/prev ではなく自作巡回（focus-cycle.sh）なのは、巡回順を
    # sketchybar WS チップのアイコン列（list-windows 順）と一致させるため
    alt-tab = 'exec-and-forget ~/.config/aerospace/focus-cycle.sh next'
    alt-shift-tab = 'exec-and-forget ~/.config/aerospace/focus-cycle.sh prev'

    # リサイズ（US 配列前提。JIS を使う場合は要調整）
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # レイアウト切替。floating 中の窓には layout tiles/accordion が拒否され無反応に
    # 見えるため（"The window is non-tiling"）、先に tiling へ戻してから切り替える
    # （tiling 中なら no-op・exit 0 なので常に安全）
    alt-slash = ['layout tiling', 'layout tiles horizontal vertical']
    alt-comma = ['layout tiling', 'layout accordion horizontal vertical']
    alt-period = 'fullscreen' # トグル

    # ワークスペース切替。native の workspace N で即時に切り替えつつ、ws-focus.sh が
    # 着地を検証して外れていたら入れ直す（目的 WS の最前面が Chrome 等の複数窓アプリ
    # だと別 WS の窓にフォーカスを横取りされるため。詳細はスクリプト内コメント）
    alt-1 = ['workspace 1', 'exec-and-forget ~/.config/aerospace/ws-focus.sh 1']
    alt-2 = ['workspace 2', 'exec-and-forget ~/.config/aerospace/ws-focus.sh 2']
    alt-3 = ['workspace 3', 'exec-and-forget ~/.config/aerospace/ws-focus.sh 3']
    alt-4 = ['workspace 4', 'exec-and-forget ~/.config/aerospace/ws-focus.sh 4']
    alt-5 = ['workspace 5', 'exec-and-forget ~/.config/aerospace/ws-focus.sh 5']
    alt-6 = ['workspace 6', 'exec-and-forget ~/.config/aerospace/ws-focus.sh 6']
    alt-7 = ['workspace 7', 'exec-and-forget ~/.config/aerospace/ws-focus.sh 7']
    alt-8 = ['workspace 8', 'exec-and-forget ~/.config/aerospace/ws-focus.sh 8']
    alt-9 = ['workspace 9', 'exec-and-forget ~/.config/aerospace/ws-focus.sh 9']

    # ウィンドウをワークスペースへ移動
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'

    # モニタ間のフォーカス移動 / ウィンドウ移動（WS=モニタ固定運用での行き来用）。
    # aerospace の next/prev はモニタ座標順（左→右）で、このデスクは JAPANNEXT(WS2) が
    # 最左のため座標順と WS 番号順が一致しない。] を WS1→2→3 の番号順巡回に
    # 合わせたいので prev/next を逆に割り当てる（他の配置では巡回順が変わるだけで無害）
    alt-leftSquareBracket = 'focus-monitor --wrap-around next'
    alt-rightSquareBracket = 'focus-monitor --wrap-around prev'
    alt-shift-leftSquareBracket = 'move-node-to-monitor --wrap-around next'
    alt-shift-rightSquareBracket = 'move-node-to-monitor --wrap-around prev'

    alt-shift-semicolon = 'mode service'

# service モード（設定リロード・レイアウトのリセット・並べ替え等、たまにしか使わない操作）
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # レイアウトのリセット
    f = ['layout floating tiling', 'mode main'] # floating / tiling の切替
    backspace = ['close-all-windows-but-current', 'mode main']

    # タイルの並べ替え。OS の Option+矢印（単語移動/選択）を奪わないよう main ではなく
    # ここに置く。連続で押せるよう mode main へは戻らない（抜けるのは enter か esc）
    left = 'move left'
    down = 'move down'
    up = 'move up'
    right = 'move right'
    enter = 'mode main' # esc と違い config リロードなしで抜ける
